name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify Ruby dependencies
        run: bundle check

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Check source content
        run: npm run check:content

      - name: Verify generated JavaScript
        run: |
          npm run build:js
          git diff --exit-code -- assets/js/main.min.js

      - name: Build and inspect site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --safe --trace
          python3 scripts/check_built_site.py _site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e
